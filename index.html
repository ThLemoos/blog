<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Em manutenção</title>
    <meta name="theme-color" content="#140a1f">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="img/icons/icon.svg">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #140a1f;
            --bg2: #22102f;
            --rose: #ff5d8f;
            --gold: #f6d9b0;
            --lilac: #b79cff;
            --ink: #f7ecf1;
            --mute: #b9a6c4;
            --serif: 'Fraunces', Georgia, serif;
            --mono: 'JetBrains Mono', ui-monospace, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            background:
                radial-gradient(60vmax 60vmax at 50% 110%, rgba(255, 93, 143, .16), transparent 60%),
                radial-gradient(50vmax 50vmax at 85% -10%, rgba(183, 156, 255, .14), transparent 60%),
                var(--bg);
            color: var(--ink);
            display: grid;
            place-items: center;
            padding: 6vh 7vw;
            min-height: 100svh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased
        }

        .box {
            text-align: center;
            animation: entra 1.2s cubic-bezier(.2, .8, .2, 1) both
        }

        .tag {
            display: inline-block;
            font-family: var(--mono);
            font-size: .85rem;
            color: var(--lilac);
            background: rgba(183, 156, 255, .14);
            border: 1px solid rgba(183, 156, 255, .3);
            padding: .25em .8em;
            border-radius: 6px;
            margin-bottom: 1.8rem
        }

        h1 {
            font-family: var(--serif);
            font-style: italic;
            font-weight: 300;
            font-size: clamp(2.8rem, 10vw, 6rem);
            line-height: 1.05;
            letter-spacing: -.02em;
            text-shadow: 0 0 30px rgba(255, 93, 143, .18)
        }

        h1 span {
            color: var(--gold)
        }

        .dots {
            margin-top: 2.2rem;
            display: flex;
            gap: .6rem;
            justify-content: center
        }

        .dots i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--rose);
            opacity: .3;
            animation: pisca 1.4s ease-in-out infinite
        }

        .dots i:nth-child(2) {
            animation-delay: .2s
        }

        .dots i:nth-child(3) {
            animation-delay: .4s
        }

        @keyframes pisca {

            0%,
            100% {
                opacity: .25;
                transform: scale(1)
            }

            50% {
                opacity: 1;
                transform: scale(1.35)
            }
        }

        @keyframes entra {
            from {
                opacity: 0;
                transform: translateY(24px)
            }
        }

        @media(prefers-reduced-motion:reduce) {

            .box,
            .dots i {
                animation: none
            }

            .dots i {
                opacity: .7
            }
        }
    </style>
</head>

<body>
    <main class="box">
        <div class="tag">status: manutenção</div>
        <h1>Em <span>manutenção</span></h1>
        <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
</body>

</html>
