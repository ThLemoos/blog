    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <main class="post-page pn-page">
        <article class="letter">
            <a class="back" href="../index.html">← Página Inicial</a>
            <h2 class="rv">Post #10: <em>Um convite especial</em></h2>

            <!-- antes da data de abertura -->
            <section id="p8-cedo" hidden>
                <p class="rv d1">Esse post ainda não abriu. Volta daqui uns dias.</p>
            </section>

            <div id="p8-corpo">
                <!-- a charada -->
                <section class="n-card" id="p8-charada">
                    <p class="n-kicker">dessa vez tem resposta certa</p>
                    <h3>Acerte e eu te conto uma coisa.</h3>
                    <p class="n-q" id="p8-pergunta"></p>
                    <form class="n-form" id="p8-form" autocomplete="off">
                        <input class="n-input" id="p8-resp" type="text" placeholder="Sua resposta"
                            aria-label="Sua resposta" autocapitalize="none" spellcheck="false">
                        <button class="cta" id="p8-go" type="submit">Descobrir</button>
                    </form>
                    <p class="n-status" id="p8-status" role="status" aria-live="polite"></p>
                </section>

                <!-- o convite (só aparece depois de acertar) -->
                <section id="p8-convite" hidden aria-label="Convite"></section>
            </div>

            <p class="rv d2 sig">— <span data-eu>Thiago Lemos</span></p>
        </article>
    </main>
    <footer>feito à mão, com muito café e um pouco de criatividade · v0.1</footer>
