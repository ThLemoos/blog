<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Post #9 · Essa foto me pegou desprevenido</title>
    <meta name="theme-color" content="#0d0714">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="../img/icons/icon.svg">
    <link rel="apple-touch-icon" href="../img/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Nosso Blog">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,300;1,9..144,600&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&family=Caveat:wght@500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/foto-juntos.css">
</head>

<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="fj-fx" aria-hidden="true"></canvas>

    <!-- porta com senha: o post só começa depois que ela acerta -->
    <section class="fj-porta" id="porta" aria-label="Senha do post">
        <div class="fj-cadeado" id="cadeado" aria-hidden="true">
            <svg viewBox="0 0 64 64" width="64" height="64">
                <path class="arco" d="M20 30V21a12 12 0 0 1 24 0v9" fill="none" stroke="currentColor" stroke-width="5"
                    stroke-linecap="round" />
                <rect x="12" y="28" width="40" height="28" rx="7" fill="currentColor" />
                <circle cx="32" cy="41" r="4" fill="#2b1838" />
                <rect x="30" y="43" width="4" height="8" rx="2" fill="#2b1838" />
            </svg>
        </div>
        <h1 class="fj-ptit">Esse post tem senha</h1>
        <p class="fj-pdica" id="pdica">Só você sabe. Digite pra abrir....</p>
        <form class="fj-pform" id="pform" autocomplete="off">
            <input id="psenha" type="password" inputmode="text" autocapitalize="off" autocorrect="off"
                spellcheck="false" placeholder="senha" aria-label="Senha">
            <button class="cta" id="pok" type="submit">Abrir</button>
        </form>
        <p class="fj-perro" id="perro" role="status" aria-live="polite"></p>
        <a class="fj-pvolta" href="../index.html">← Página Inicial</a>
    </section>

    <main class="post-page fj" id="fj" hidden>
        <article class="letter">
            <a class="back" href="../index.html">← Página Inicial</a>
            <h2 class="rv">Post #9: <em>Sem filtro</em></h2>

            <!-- visor da câmera + foto -->
            <section class="fj-palco" id="palco" aria-label="Foto">
                <div class="fj-quadro" id="quadro">
                    <div class="fj-foto" id="fj-foto">
                        <img id="foto" src="../img/foto-juntos.jpeg" alt="Thiago e Sandy rindo" decoding="async">
                        <div class="fj-sem">Coloque a foto em<br><b>img/foto-juntos.jpg</b></div>
                        <span class="fj-grao" aria-hidden="true"></span>
                        <span class="fj-brilho" aria-hidden="true"></span>
                        <span class="fj-flash" id="flash" aria-hidden="true"></span>
                    </div>
                    <!-- cantos do visor -->
                    <i class="fj-c c1"></i><i class="fj-c c2"></i><i class="fj-c c3"></i><i class="fj-c c4"></i>
                    <span class="fj-af" id="af" aria-hidden="true"></span>
                    <span class="fj-hud" id="hud" aria-hidden="true"><b></b> flagrante</span>
                    <span class="fj-selo" aria-hidden="true">sem filtro</span>
                </div>
            </section>

            <!-- o texto: cada linha vai se formando palavra por palavra e fica na tela -->
            <section class="fj-texto" id="texto" aria-live="polite" aria-label="Texto"></section>
            <p class="fj-dica" id="dica">toque pra acelerar</p>

            <div class="fj-fim" id="fim" hidden>
                <p class="fj-sig">— <span data-eu>Thiago Lemos</span></p>
                <button class="cta" id="de-novo" type="button">↻ Ver de novo</button>
            </div>
        </article>
    </main>
    <footer>feito à mão, com muito café e um pouco de criatividade · v0.1</footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/foto-juntos.js"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/novo.js"></script>
</body>

</html>
